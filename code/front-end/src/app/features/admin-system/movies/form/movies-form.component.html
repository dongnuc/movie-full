<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-sm overflow-y-auto animate-fadeIn">
  <div class="relative w-full max-w-2xl bg-[#181818] border border-[#282828] rounded shadow-2xl overflow-hidden font-netflix my-8">
    
    <!-- Header -->
    <div class="px-6 py-4 bg-[#1e1e1e] border-b border-[#282828] flex justify-between items-center">
      <h3 class="text-lg font-bold text-white">
        {{ movieId ? 'Chỉnh sửa Phim' : 'Thêm Phim Mới' }}
      </h3>
      <button (click)="onCancel()" class="text-netflix-gray-light/60 hover:text-white transition duration-150">
        ✕
      </button>
    </div>

    <!-- Error Alert -->
    <div *ngIf="errorMessage" class="mx-6 mt-4 p-3 bg-red-900/40 border border-red-500/20 text-red-200 text-xs rounded">
      ⚠️ {{ errorMessage }}
    </div>

    <!-- Loading Overlay -->
    <div *ngIf="loading" class="p-16 flex justify-center items-center">
      <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-netflix-red"></div>
    </div>

    <!-- Form Content -->
    <form *ngIf="!loading" (ngSubmit)="onSubmit()" class="p-6 space-y-4 text-sm max-h-[75vh] overflow-y-auto">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Title -->
        <div class="space-y-1.5 col-span-2">
          <label for="title" class="block font-semibold text-netflix-gray-light/80">Tên phim *</label>
          <input type="text"
                 id="title"
                 name="title"
                 [(ngModel)]="movie.title"
                 placeholder="Nhập tên phim..."
                 class="w-full bg-[#2a2a2a] border border-[#3a3a3a] text-white rounded px-3.5 py-2 focus:outline-none focus:border-netflix-red text-sm transition-all duration-150"
                 required />
        </div>

        <!-- Category select -->
        <div class="space-y-1.5">
          <label for="category" class="block font-semibold text-netflix-gray-light/80">Thể loại *</label>
          <select id="category"
                  name="categoryId"
                  [(ngModel)]="movie.categoryId"
                  class="w-full bg-[#2a2a2a] border border-[#3a3a3a] text-white rounded px-3.5 py-2 focus:outline-none focus:border-netflix-red text-sm transition-all duration-150"
                  required>
            <option value="">Chọn thể loại...</option>
            <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
          </select>
        </div>

        <!-- Duration -->
        <div class="space-y-1.5">
          <label for="duration" class="block font-semibold text-netflix-gray-light/80">Thời lượng (phút) *</label>
          <input type="number"
                 id="duration"
                 name="duration"
                 [(ngModel)]="movie.duration"
                 placeholder="Ví dụ: 120"
                 class="w-full bg-[#2a2a2a] border border-[#3a3a3a] text-white rounded px-3.5 py-2 focus:outline-none focus:border-netflix-red text-sm transition-all duration-150"
                 required />
        </div>

        <!-- Base Price -->
        <div class="space-y-1.5">
          <label for="basePrice" class="block font-semibold text-netflix-gray-light/80">Giá vé cơ bản (VND) *</label>
          <input type="number"
                 id="basePrice"
                 name="basePrice"
                 [(ngModel)]="movie.basePrice"
                 placeholder="Ví dụ: 75000"
                 class="w-full bg-[#2a2a2a] border border-[#3a3a3a] text-white rounded px-3.5 py-2 focus:outline-none focus:border-netflix-red text-sm transition-all duration-150"
                 required />
        </div>

        <!-- IsActive -->
        <div class="flex items-end pb-3">
          <label class="flex items-center space-x-2 cursor-pointer select-none">
            <input type="checkbox"
                   name="isActive"
                   [(ngModel)]="movie.isActive"
                   class="w-4 h-4 rounded accent-netflix-red bg-[#2a2a2a] border-[#3a3a3a] focus:ring-0 cursor-pointer" />
            <span class="font-semibold text-netflix-gray-light/80">Kích hoạt hiển thị phim</span>
          </label>
        </div>

        <!-- Image URL -->
        <div class="space-y-1.5 col-span-2">
          <label for="image" class="block font-semibold text-netflix-gray-light/80">Link ảnh Poster (URL) *</label>
          <input type="text"
                 id="image"
                 name="image"
                 [(ngModel)]="movie.image"
                 placeholder="Nhập URL ảnh poster..."
                 class="w-full bg-[#2a2a2a] border border-[#3a3a3a] text-white rounded px-3.5 py-2 focus:outline-none focus:border-netflix-red text-sm transition-all duration-150"
                 required />
        </div>

        <!-- Description -->
        <div class="space-y-1.5 col-span-2">
          <label for="description" class="block font-semibold text-netflix-gray-light/80">Mô tả phim</label>
          <textarea id="description"
                    name="description"
                    [(ngModel)]="movie.description"
                    rows="3"
                    placeholder="Mô tả tóm tắt nội dung phim..."
                    class="w-full bg-[#2a2a2a] border border-[#3a3a3a] text-white rounded px-3.5 py-2 focus:outline-none focus:border-netflix-red text-sm transition-all duration-150"></textarea>
        </div>
      </div>

      <!-- Form Action Buttons -->
      <div class="flex items-center justify-end space-x-3 pt-6 border-t border-[#282828] mt-6">
        <button type="button"
                (click)="onCancel()"
                [disabled]="saving"
                class="px-4 py-2 rounded text-xs font-bold bg-transparent border border-[#3a3a3a] text-netflix-gray-light hover:bg-[#222] transition duration-150 disabled:opacity-40">
          Hủy bỏ
        </button>
        <button type="submit"
                [disabled]="saving"
                class="px-5 py-2 rounded text-xs font-bold bg-netflix-red text-white hover:bg-netflix-red/90 transition duration-150 disabled:opacity-40 flex items-center gap-1.5">
          <span *ngIf="saving" class="animate-spin rounded-full h-3 w-3 border-t-2 border-b-2 border-white"></span>
          {{ saving ? 'Đang lưu...' : 'Lưu lại' }}
        </button>
      </div>
    </form>
  </div>
</div>
