<div class="space-y-6">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold">Danh sách Vai Trò</h1>
      <p class="text-xs text-netflix-gray-light/60">Quản lý các vai trò (quyền hạn) trong hệ thống</p>
    </div>
    <button (click)="openCreate()"
            class="px-4 py-2 bg-netflix-red text-white font-bold rounded text-sm hover:bg-netflix-red/90 transition duration-200 shadow">
      + Thêm Vai Trò
    </button>
  </div>

  <!-- Dynamic Admin Table -->
  <app-admin-table [columns]="columns"
                   [data]="roles()"
                   [totalCount]="roles().length"
                   [pageIndex]="1"
                   [pageSize]="999"
                   [loading]="loading()"
                   [showSearch]="false"
                   [showToggleActiveAction]="false"
                   [showDeleteAction]="true"
                   (edit)="onEdit($event)"
                   (delete)="onDelete($event)"></app-admin-table>

  <!-- Modal Roles Form -->
  <app-admin-roles-form *ngIf="showForm()"
                        [role]="selectedRole()"
                        (close)="onFormClose($event)"></app-admin-roles-form>
</div>
