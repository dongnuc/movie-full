<div class="space-y-6">
  <!-- Header with Theater Selector -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
    <div>
      <h1 class="text-2xl font-bold">Quản lý Phòng Chiếu</h1>
      <p class="text-xs text-netflix-gray-light/60">Quản lý số phòng, số hàng ghế và cấu hình sơ đồ chỗ ngồi</p>
    </div>
    
    <div class="flex items-center gap-3 w-full sm:w-auto">
      <div class="flex items-center gap-2">
        <span class="text-xs text-netflix-gray-light/60 font-semibold whitespace-nowrap">Chọn Rạp:</span>
        <select [ngModel]="selectedTheaterId()"
                (ngModelChange)="onTheaterChange($event)"
                class="bg-[#181818] border border-[#282828] text-white rounded px-3 py-1.5 focus:outline-none focus:border-netflix-red text-sm transition duration-150">
          <option *ngFor="let t of theaters()" [value]="t.id">{{ t.name }}</option>
        </select>
      </div>
      
      <button (click)="openCreate()"
              class="px-4 py-2 bg-blue-600 text-white font-bold rounded text-sm hover:bg-blue-700 transition duration-200 shadow ml-auto sm:ml-0">
        + Thêm Phòng
      </button>
    </div>
  </div>

  <!-- Notice for Uninitialized Seats -->
  <ng-container *ngFor="let room of rooms()">
    <div *ngIf="room.totalSeat === 0" 
         class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 p-4 bg-yellow-900/20 border border-yellow-500/20 rounded-md text-sm text-yellow-300">
      <div class="flex items-center gap-2">
        <span>⚠️</span>
        <span>Phòng chiếu <strong>{{ room.name }}</strong> vừa được tạo và chưa có sơ đồ chỗ ngồi!</span>
      </div>
      <button (click)="generateSeats(room)" 
              class="px-3 py-1 bg-yellow-600 hover:bg-yellow-700 text-white font-bold text-xs rounded transition duration-150">
        Khởi Tạo Ghế Tự Động
      </button>
    </div>
  </ng-container>

  <!-- Dynamic Admin Table -->
  <app-admin-table [columns]="columns"
                   [data]="rooms()"
                   [totalCount]="totalCount()"
                   [pageIndex]="pageIndex()"
                   [pageSize]="pageSize()"
                   [loading]="loading()"
                   [showSearch]="false"
                   [showDeleteAction]="true"
                   (pageChange)="onPageChange($event)"
                   (pageSizeChange)="onPageSizeChange($event)"
                   (edit)="onEdit($event)"
                   (toggleActive)="onToggleActive($event)"
                   (delete)="onDelete($event)"></app-admin-table>

  <!-- Modal Rooms Form -->
  <app-theater-rooms-form *ngIf="showForm()"
                          [roomId]="selectedRoomId()"
                          [theaterId]="selectedTheaterId()"
                          (close)="onFormClose($event)"></app-theater-rooms-form>
</div>
