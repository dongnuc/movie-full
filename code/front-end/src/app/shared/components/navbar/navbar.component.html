<nav class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-12 py-4 transition-all duration-300"
     [ngClass]="{ 'bg-netflix-black border-b border-[#222]': isScrolled(), 'bg-transparent': !isScrolled() }">
  
  <!-- Left Nav Items -->
  <div class="flex items-center space-x-12">
    <a routerLink="/" class="text-3xl font-extrabold text-netflix-red tracking-wider">NETFLIX</a>
    <ul class="hidden md:flex space-x-6 text-sm text-netflix-gray-light font-medium">
      <li>
        <a routerLink="/" routerLinkActive="text-white font-semibold" [routerLinkActiveOptions]="{exact: true}" class="hover:text-white transition">
          Trang chủ
        </a>
      </li>
      <li>
        <a routerLink="/movies" routerLinkActive="text-white font-semibold" class="hover:text-white transition">
          Danh sách phim
        </a>
      </li>
      <li><a routerLink="/movies" class="hover:text-white transition">Thể loại</a></li>
      <li><a href="#" class="hover:text-white transition">Lịch chiếu hôm nay</a></li>
    </ul>
  </div>

  <!-- Right Nav Items (Search, Profile, Auth state) -->
  <div class="flex items-center space-x-6 text-sm">
    <!-- Search button placeholder -->
    <button class="hover:text-netflix-gray-light transition text-white/80 hover:text-white">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.637 10.637z" />
      </svg>
    </button>

    <!-- Auth CTA or Profile Dropdown -->
    <div *ngIf="authService.isAuthenticated(); else authCTA" class="flex items-center space-x-4">
      <!-- User Points Badge -->
      <div *ngIf="userPoints() !== null" 
           class="flex items-center gap-1.5 bg-[#181818] border border-amber-500/30 rounded-full px-3 py-1 text-amber-400 font-bold shadow-lg hover:border-amber-400/50 transition duration-300">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4 text-amber-500">
          <path fill-rule="evenodd" d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.006 5.404.434c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.434 2.082-5.005Z" clip-rule="evenodd" />
        </svg>
        <span class="text-xs tracking-wider">{{ userPoints() | number }} P</span>
      </div>

      <div class="relative group">
        <button class="flex items-center space-x-2 focus:outline-none pb-2 text-white/90 hover:text-white font-medium">
          <img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png" class="w-8 h-8 rounded" alt="Avatar" />
          <span class="hidden md:inline">Welcome {{ authService.currentUser()?.username }}</span>
        </button>
        
        <!-- Padded container to bridge the hover gap seamlessly -->
        <div class="absolute right-0 pt-2 w-48 opacity-0 pointer-events-none group-hover:opacity-100 group-hover:pointer-events-auto transition duration-200 z-50">
          <div class="bg-netflix-black border border-netflix-gray-dark rounded shadow-lg text-white">
            <a *ngIf="authService.isSystemAdmin()" routerLink="/admin-system" class="block px-4 py-3 text-sm hover:bg-[#222] transition text-netflix-red font-bold border-b border-[#222]">
              System Admin
            </a>
            <a *ngIf="authService.isTheaterOwner()" routerLink="/admin-theater" class="block px-4 py-3 text-sm hover:bg-[#222] transition text-blue-400 font-bold border-b border-[#222]">
              Theater Owner
            </a>
            <a routerLink="/profile/history" class="block px-4 py-3 text-sm hover:bg-[#222] transition">Lịch sử đặt vé</a>
            <button (click)="logout()" class="w-full text-left px-4 py-3 text-sm hover:bg-[#222] border-t border-[#222] text-netflix-red font-semibold transition">
              Đăng xuất
            </button>
          </div>
        </div>
      </div>
    </div>
    
    <ng-template #authCTA>
      <a routerLink="/auth/login" class="px-4 py-2 bg-netflix-red text-white font-bold rounded text-xs hover:bg-netflix-red/90">
        Đăng Nhập
      </a>
    </ng-template>
  </div>
</nav>
